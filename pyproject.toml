[project]
name = "renewal-radar"
version = "0.1.0"
description = "Shows procurement which vendor contracts renew in the next 30/60/90 days so nothing auto-renews unnoticed."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The coverage floor is a quality gate (QUA-2). CI runs the same command.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85 -q"

[tool.coverage.run]
source = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
per-file-ignores = { "tests/*" = ["S101", "S105", "S106"] }
